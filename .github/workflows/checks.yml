name: Offline learning checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m unittest discover -s prior-auth -p 'test_*.py' -v
      - run: python -m unittest discover -s system-design -p 'test_*.py' -v
      - run: python -m unittest discover -s beginner-lab -p 'test_*.py' -v
      - run: python -m unittest discover -s evidence-lab -p 'test_*.py' -v
      - run: python system-design/review_race.py
      - run: python evidence-lab/evidence_lab.py
